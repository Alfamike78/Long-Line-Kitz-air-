<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS 350 Rope Cycles</title>
<meta name="theme-color" content="#1f4e9c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1a1d23; --muted: #5f6673;
    --border: #d5dae2; --accent: #1f4e9c; --accent-text: #ffffff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1c2029; --text: #e8eaef; --muted: #9aa1ad;
      --border: #333a47; --accent: #5b8def; --accent-text: #0b1020; --danger: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  header { background: var(--accent); color: var(--accent-text); padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
  header h1 { margin: 0; font-size: 18px; }
  nav { display: flex; position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border); z-index: 1; }
  nav button { flex: 1; padding: 14px 4px; border: 0; background: none; color: var(--muted); font-size: 15px; border-bottom: 3px solid transparent; }
  nav button.attivo { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .riga:first-of-type { border-top: 0; }
  .contatore { display: flex; align-items: center; gap: 6px; }
  .contatore button { width: 44px; height: 44px; font-size: 22px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .contatore input { width: 64px; text-align: center; padding: 10px 4px; }
  .azione { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); margin-top: 6px; }
  .secondaria { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .errore { color: var(--danger); font-size: 14px; min-height: 1.2em; }
  .ok { color: var(--accent); font-size: 14px; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 8px 4px; border-top: 1px solid var(--border); text-align: left; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .voce { display: flex; justify-content: space-between; gap: 8px; }
  .voce small { color: var(--muted); }
  .elimina { background: none; border: 0; color: var(--danger); font-size: 14px; padding: 4px; }
  .vuoto { color: var(--muted); }
</style>
</head>
<body>
<header><h1>Rope cycles – AS 350</h1></header>
<nav>
  <button data-vista="inserisci" class="attivo">New entry</button>
  <button data-vista="totali">Totals</button>
  <button data-vista="registro">Log</button>
</nav>
<main>
  <section id="inserisci">
    <form id="modulo" novalidate>
      <div class="card">
        <label for="data">Date</label>
        <input type="date" id="data" required>
        <label for="pic">PIC</label>
        <input type="text" id="pic" autocomplete="name" required>
        <label for="farbcode">Color code (transport lines)</label>
        <select id="farbcode"></select>
      </div>
      <div id="gruppi"></div>
      <p class="errore" id="errore"></p>
      <p class="ok" id="conferma"></p>
      <button class="azione" type="submit">Save</button>
    </form>
  </section>

  <section id="totali" hidden></section>

  <section id="registro" hidden>
    <div class="card">
      <button class="azione" id="esportaCsv">Export CSV</button>
      <button class="azione secondaria" id="esportaBackup">Download backup</button>
      <button class="azione secondaria" id="importaBackup">Restore backup</button>
      <input type="file" id="fileBackup" accept="application/json,.json" hidden>
      <p class="errore" id="erroreBackup"></p>
    </div>
    <div id="elenco"></div>
  </section>
</main>

<script>
const FARBCODES = ['Purple', 'Brown', 'Orange', 'Red', 'Grey', 'Yellow-Green'];
// Colonne del foglio APP950-GEN, nello stesso ordine.
const GRUPPI = [
  { nome: 'Transport lines', perFarbcode: true, campi: [
    { k: 'daempfung', label: 'Damper' },
    { k: 't10', label: '10 m' },
    { k: 't20', label: '20 m' },
    { k: 't30', label: '30 m' },
  ] },
  { nome: 'Logging lines', campi: [
    { k: 'log_rot', label: 'Logging line red' },
    { k: 'log_blau', label: 'Logging line blue' },
  ] },
  { nome: '2-leg slings', campi: [
    { k: 'geh_rot', label: '2-leg sling red' },
    { k: 'geh_gelb', label: '2-leg sling yellow' },
    { k: 'geh_blau', label: '2-leg sling blue' },
  ] },
];
const CAMPI = GRUPPI.flatMap(g => g.campi);
const CAMPI_TRASPORTO = GRUPPI[0].campi.map(c => c.k);
const CHIAVE = 'cicli-corde-v1';

function leggi(chiave, predefinito) {
  try { return JSON.parse(localStorage.getItem(chiave)) ?? predefinito; } catch { return predefinito; }
}
function scrivi(chiave, valore) {
  localStorage.setItem(chiave, JSON.stringify(valore));
}
let voci = leggi(CHIAVE, []);

function salvaVoci() {
  try {
    scrivi(CHIAVE, voci);
    return true;
  } catch {
    return false;
  }
}

// Ritorna un messaggio di errore, oppure null se la voce è valida.
function valida(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.data)) return 'Enter the date.';
  if (typeof v.pic !== 'string' || !v.pic.trim()) return 'Enter the PIC.';
  if (v.farbcode && !FARBCODES.includes(v.farbcode)) return 'Invalid color code.';
  for (const c of CAMPI) {
    if (!Number.isInteger(v.cicli[c.k]) || v.cicli[c.k] < 0) return `Invalid value for ${c.label}.`;
  }
  if (CAMPI.every(c => v.cicli[c.k] === 0)) return 'Enter at least one cycle.';
  if (CAMPI_TRASPORTO.some(k => v.cicli[k] > 0) && !v.farbcode) return 'Select the color code of the transport lines.';
  return null;
}

function calcolaTotali(elenco) {
  const tot = {};
  for (const v of elenco) {
    for (const c of CAMPI) {
      if (!v.cicli[c.k]) continue;
      const nome = CAMPI_TRASPORTO.includes(c.k) ? `${v.farbcode} – ${c.label}` : c.label;
      tot[nome] = (tot[nome] || 0) + v.cicli[c.k];
    }
  }
  return tot;
}

function dataIt(iso) {
  const [a, m, g] = iso.split('-');
  return `${g}.${m}.${a}`;
}

function creaCsv(elenco) {
  const cella = s => /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const intestazione = ['Date', 'PIC', 'Color code', ...CAMPI.map(c => `Cycles ${c.label}`)];
  const righe = [...elenco].sort((a, b) => a.data.localeCompare(b.data)).map(v =>
    [dataIt(v.data), v.pic, v.farbcode, ...CAMPI.map(c => String(v.cicli[c.k] || ''))]);
  // BOM per far leggere correttamente le dieresi a Excel.
  return '﻿' + [intestazione, ...righe].map(r => r.map(cella).join(';')).join('\r\n');
}

function scarica(nomeFile, contenuto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenuto], { type: tipo }));
  a.download = nomeFile;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- Interfaccia ---
const $ = id => document.getElementById(id);

function costruisciModulo() {
  $('farbcode').innerHTML = '<option value="">—</option>' +
    FARBCODES.map(f => `<option>${f}</option>`).join('');
  $('gruppi').innerHTML = GRUPPI.map(g => `
    <div class="card"><h2>${g.nome}</h2>
      ${g.campi.map(c => `
        <div class="riga">
          <span>${c.label}</span>
          <span class="contatore">
            <button type="button" data-meno="${c.k}" aria-label="Minus">−</button>
            <input type="number" inputmode="numeric" min="0" step="1" id="c_${c.k}" value="0" aria-label="${c.label}">
            <button type="button" data-piu="${c.k}" aria-label="Plus">+</button>
          </span>
        </div>`).join('')}
    </div>`).join('');
  $('gruppi').addEventListener('click', e => {
    const k = e.target.dataset.piu || e.target.dataset.meno;
    if (!k) return;
    const input = $('c_' + k);
    const n = (parseInt(input.value, 10) || 0) + (e.target.dataset.piu ? 1 : -1);
    input.value = Math.max(0, n);
  });
  azzeraModulo();
}

function azzeraModulo() {
  $('data').value = new Date().toLocaleDateString('sv');
  $('pic').value = leggi('cicli-corde-pic', '');
  $('farbcode').value = '';
  for (const c of CAMPI) $('c_' + c.k).value = 0;
}

$('modulo').addEventListener('submit', e => {
  e.preventDefault();
  $('conferma').textContent = '';
  const v = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    data: $('data').value,
    pic: $('pic').value.trim(),
    farbcode: $('farbcode').value,
    cicli: Object.fromEntries(CAMPI.map(c => [c.k, Number($('c_' + c.k).value)])),
  };
  const errore = valida(v);
  $('errore').textContent = errore || '';
  if (errore) return;
  // Il Farbcode vale solo per le Transportleinen: se non ci sono cicli di trasporto non lo registro.
  if (!CAMPI_TRASPORTO.some(k => v.cicli[k] > 0)) v.farbcode = '';
  voci.push(v);
  if (!salvaVoci()) {
    voci.pop();
    $('errore').textContent = 'Save failed: browser storage is not available.';
    return;
  }
  try { scrivi('cicli-corde-pic', v.pic); } catch {}
  azzeraModulo();
  $('conferma').textContent = `Saved: ${dataIt(v.data)}, ${v.pic}.`;
});

function mostraTotali() {
  const tot = calcolaTotali(voci);
  const nomi = Object.keys(tot);
  $('totali').innerHTML = `<div class="card"><h2>Total cycles per item</h2>` +
    (nomi.length ? `<table><tr><th>Item</th><th class="num">Cycles</th></tr>` +
      nomi.map(n => `<tr><td>${n}</td><td class="num">${tot[n]}</td></tr>`).join('') + '</table>'
      : '<p class="vuoto">No data recorded.</p>') + '</div>';
}

function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
}

function mostraRegistro() {
  const ordinate = [...voci].sort((a, b) => b.data.localeCompare(a.data));
  $('elenco').innerHTML = ordinate.length ? ordinate.map(v => {
    const dettagli = CAMPI.filter(c => v.cicli[c.k]).map(c =>
      `${CAMPI_TRASPORTO.includes(c.k) ? v.farbcode + ' ' : ''}${c.label}: ${v.cicli[c.k]}`).join(' · ');
    return `<div class="card voce"><div><strong>${dataIt(v.data)}</strong> – ${esc(v.pic)}<br><small>${dettagli}</small></div>
      <button class="elimina" data-id="${v.id}">Delete</button></div>`;
  }).join('') : '<p class="vuoto">No entries.</p>';
}

$('elenco').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id || !confirm('Delete this entry?')) return;
  voci = voci.filter(v => v.id !== id);
  salvaVoci();
  mostraRegistro();
});

$('esportaCsv').addEventListener('click', () =>
  scarica(`rope-cycles-${new Date().toLocaleDateString('sv')}.csv`, creaCsv(voci), 'text/csv;charset=utf-8'));
$('esportaBackup').addEventListener('click', () =>
  scarica(`rope-cycles-backup-${new Date().toLocaleDateString('sv')}.json`, JSON.stringify(voci, null, 1), 'application/json'));
$('importaBackup').addEventListener('click', () => $('fileBackup').click());
$('fileBackup').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const importate = JSON.parse(await file.text());
    if (!Array.isArray(importate) || importate.some(v => !v.id || valida(v))) throw new Error();
    // Unione per id: reimportare lo stesso backup non crea doppioni.
    const esistenti = new Set(voci.map(v => v.id));
    const nuove = importate.filter(v => !esistenti.has(v.id));
    voci = voci.concat(nuove);
    salvaVoci();
    $('erroreBackup').textContent = '';
    alert(`Restored ${nuove.length} entries.`);
    mostraRegistro();
  } catch {
    $('erroreBackup').textContent = 'Invalid backup file.';
  }
});

document.querySelector('nav').addEventListener('click', e => {
  const vista = e.target.dataset.vista;
  if (!vista) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('attivo', b === e.target));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== vista);
  if (vista === 'totali') mostraTotali();
  if (vista === 'registro') mostraRegistro();
});

costruisciModulo();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
