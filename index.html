<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AS 350 Rope Cycles</title>
<meta name="theme-color" content="#1f4e9c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1a1d23; --muted: #5f6673;
    --border: #d5dae2; --accent: #1f4e9c; --accent-text: #ffffff; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1c2029; --text: #e8eaef; --muted: #9aa1ad;
      --border: #333a47; --accent: #5b8def; --accent-text: #0b1020; --danger: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  header { background: var(--accent); color: var(--accent-text); padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); }
  header h1 { margin: 0; font-size: 18px; }
  nav { display: flex; position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border); z-index: 1; }
  nav button { flex: 1; padding: 14px 4px; border: 0; background: none; color: var(--muted); font-size: 15px; border-bottom: 3px solid transparent; }
  nav button.attivo { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .riga:first-of-type { border-top: 0; }
  .contatore { display: flex; align-items: center; gap: 6px; }
  .contatore button { width: 44px; height: 44px; font-size: 22px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .contatore input { width: 64px; text-align: center; padding: 10px 4px; }
  .azione { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); margin-top: 6px; }
  .secondaria { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .errore { color: var(--danger); font-size: 14px; min-height: 1.2em; }
  .ok { color: var(--accent); font-size: 14px; min-height: 1.2em; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 8px 4px; border-top: 1px solid var(--border); text-align: left; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .voce { display: flex; justify-content: space-between; gap: 8px; }
  .voce small { color: var(--muted); }
  .elimina { background: none; border: 0; color: var(--danger); font-size: 14px; padding: 4px; }
  .vuoto { color: var(--muted); }
  .corda { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 0; font: inherit; }
  header small { display: block; font-size: 13px; opacity: .85; }
  .azioni { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
<header><h1>Rope cycles – AS 350</h1><small id="statoSync"></small></header>
<nav>
  <button data-vista="inserisci" class="attivo">New entry</button>
  <button data-vista="totali">Totals</button>
  <button data-vista="registro">Log</button>
  <button data-vista="corde">Ropes</button>
</nav>
<main>
  <section id="inserisci">
    <form id="modulo" novalidate>
      <div class="card">
        <p class="ok" id="inModifica" hidden></p>
        <label for="data">Date</label>
        <input type="date" id="data" required>
        <label for="pic">PIC</label>
        <input type="text" id="pic" autocomplete="name" required>
      </div>
      <div class="card"><h2>Cycles per rope</h2><div id="contatori"></div></div>
      <p class="errore" id="errore"></p>
      <p class="ok" id="conferma"></p>
      <button class="azione" type="submit">Save</button>
      <button class="azione secondaria" type="button" id="annulla" hidden>Cancel edit</button>
    </form>
  </section>

  <section id="totali" hidden></section>

  <section id="registro" hidden>
    <div class="card">
      <button class="azione" id="esportaCsv">Export CSV</button>
    </div>
    <div id="elenco"></div>
    <form id="moduloSync" class="card" novalidate>
      <h2>Google Drive sync</h2>
      <label for="s_url">Script URL</label>
      <input id="s_url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="s_token">Access code</label>
      <input id="s_token">
      <button class="azione secondaria" type="submit">Save and sync</button>
    </form>
  </section>

  <section id="corde" hidden>
    <form id="moduloCorda" class="card" novalidate>
      <h2>Add / edit rope</h2>
      <label for="r_id">ID (barcode no. on the Kitz-Air label)</label>
      <input id="r_id" inputmode="numeric" required>
      <label for="r_type">Type</label>
      <select id="r_type"></select>
      <label for="r_length">Length (m)</label>
      <input id="r_length" type="number" inputmode="decimal" min="0">
      <label for="r_color">Color code</label>
      <select id="r_color"></select>
      <label for="r_manufacturer">Manufacturer</label>
      <input id="r_manufacturer">
      <label for="r_serial">Manufacturer serial no.</label>
      <input id="r_serial">
      <label for="r_wll">WLL (kg)</label>
      <input id="r_wll" type="number" inputmode="numeric" min="0">
      <label for="r_mfg">Manufactured (year/month)</label>
      <input id="r_mfg" type="month">
      <label for="r_note">Note</label>
      <input id="r_note">
      <p class="errore" id="erroreCorda"></p>
      <button class="azione" type="submit">Save rope</button>
    </form>
    <div id="elencoCorde"></div>
  </section>
</main>

<script>
const TIPI = ['Transport line', 'Damper', 'Logging line', '2-leg sling'];
const COLORI = ['Purple', 'Brown', 'Orange', 'Red', 'Grey', 'Yellow-Green', 'Blue', 'Yellow'];
const CHIAVE = 'rope-cycles-v3';
const CHIAVE_CODA = 'rope-cycles-outbox';
const CHIAVE_SYNC = 'rope-cycles-sync';

function leggi(chiave, predefinito) {
  try { return JSON.parse(localStorage.getItem(chiave)) ?? predefinito; } catch { return predefinito; }
}
function scrivi(chiave, valore) {
  localStorage.setItem(chiave, JSON.stringify(valore));
}
let db = leggi(CHIAVE, { ropes: [], entries: [] });
// Modifiche fatte sul telefono e non ancora arrivate al foglio Google.
let coda = leggi(CHIAVE_CODA, []);
let sync = leggi(CHIAVE_SYNC, { url: '', token: '' });

function salvaDb() {
  try {
    scrivi(CHIAVE, db);
    scrivi(CHIAVE_CODA, coda);
    return true;
  } catch {
    return false;
  }
}

const visibili = elenco => elenco.filter(x => !x.deleted);
const corda = id => db.ropes.find(r => r.id === id);
const descrivi = r => [r.type, r.length ? r.length + ' m' : '', r.color].filter(Boolean).join(' · ');

// Ritorna un messaggio di errore, oppure null se la voce è valida.
function valida(v, ropes) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date)) return 'Enter the date.';
  if (typeof v.pic !== 'string' || !v.pic.trim()) return 'Enter the PIC.';
  const ids = Object.keys(v.cycles || {});
  if (!ids.length) return 'Enter at least one cycle.';
  for (const id of ids) {
    if (!ropes.some(r => r.id === id)) return `Unknown rope ${id}.`;
    if (!Number.isInteger(v.cycles[id]) || v.cycles[id] <= 0) return `Invalid value for rope ${id}.`;
  }
  return null;
}

function validaCorda(r) {
  if (typeof r.id !== 'string' || !r.id.trim()) return 'Enter the rope ID.';
  if (!TIPI.includes(r.type)) return 'Select the type.';
  if (r.color && !COLORI.includes(r.color)) return 'Invalid color code.';
  if (r.length !== null && !(r.length > 0)) return 'Invalid length.';
  if (r.wll !== null && !(r.wll > 0)) return 'Invalid WLL.';
  return null;
}

function calcolaTotali(entries) {
  const tot = {};
  for (const v of visibili(entries)) {
    for (const [id, n] of Object.entries(v.cycles)) tot[id] = (tot[id] || 0) + n;
  }
  return tot;
}

// Applica una modifica in locale (sostituisce l'elemento con lo stesso id).
function applica(tabella, item) {
  const elenco = tabella === 'Ropes' ? db.ropes : db.entries;
  const i = elenco.findIndex(x => x.id === item.id);
  if (i >= 0) elenco[i] = item; else elenco.push(item);
}

// Salva una modifica sul telefono, la mette in coda per il foglio Google e prova a inviarla.
function registra(tabella, item) {
  item.updatedAt = new Date().toISOString();
  item.updatedBy = leggi('rope-cycles-pic', '');
  const precedente = JSON.stringify(db);
  applica(tabella, item);
  coda.push({ table: tabella, item });
  if (!salvaDb()) {
    db = JSON.parse(precedente);
    coda.pop();
    return false;
  }
  sincronizza();
  return true;
}

// I valori dal foglio arrivano tutti come testo.
function normalizza(dati) {
  const bool = x => x === true || String(x).toLowerCase() === 'true';
  const num = x => x === '' || x == null ? null : Number(x);
  return {
    ropes: dati.ropes.map(r => ({ ...r, length: num(r.length), wll: num(r.wll), deleted: bool(r.deleted) })),
    entries: dati.entries.map(v => {
      let cycles = {};
      try { cycles = typeof v.cycles === 'string' ? JSON.parse(v.cycles) : v.cycles; } catch {}
      return { ...v, cycles, deleted: bool(v.deleted) };
    }),
  };
}

let sincronizzando = false;
async function sincronizza() {
  if (!sync.url || sincronizzando) return mostraStato();
  sincronizzando = true;
  mostraStato('Syncing…');
  const inviate = coda.length;
  try {
    const res = await fetch(sync.url, {
      method: 'POST',
      // text/plain evita la richiesta preliminare CORS, che Apps Script non gestisce.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token: sync.token, changes: coda.slice(0, inviate) }),
    });
    const dati = await res.json();
    if (dati.error) throw new Error(dati.error);
    coda.splice(0, inviate);
    db = normalizza(dati);
    // Modifiche fatte durante l'invio: restano in coda e si riapplicano sopra i dati del foglio.
    for (const c of coda) applica(c.table, c.item);
    salvaDb();
    try { scrivi('rope-cycles-ultimo-sync', new Date().toISOString()); } catch {}
    sincronizzando = false;
    aggiornaVista();
    if (coda.length) sincronizza();
  } catch (err) {
    sincronizzando = false;
    mostraStato(err.message && !/fetch|JSON|network/i.test(err.message) ? `Sync error: ${err.message}` : null);
  }
}

function mostraStato(testo) {
  if (!testo) {
    const ultimo = leggi('rope-cycles-ultimo-sync', null);
    testo = !sync.url ? 'Not connected to Google Drive – data only on this phone'
      : (coda.length ? `${coda.length} change(s) waiting for network · ` : '') +
        (ultimo ? `Last sync ${new Date(ultimo).toLocaleString('en-GB')}` : 'Never synced');
  }
  $('statoSync').textContent = testo;
}

function dataIt(iso) {
  const [a, m, g] = iso.split('-');
  return `${g}.${m}.${a}`;
}

// Una riga per ogni corda usata in ogni registrazione.
function creaCsv({ ropes, entries }) {
  const cella = s => /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const intestazione = ['Date', 'PIC', 'Rope ID', 'Type', 'Length (m)', 'Color code', 'Cycles'];
  const righe = visibili(entries).sort((a, b) => a.date.localeCompare(b.date)).flatMap(v =>
    Object.entries(v.cycles).map(([id, n]) => {
      const r = ropes.find(x => x.id === id) || {};
      return [dataIt(v.date), v.pic, id, r.type || '', String(r.length ?? ''), r.color || '', String(n)];
    }));
  // BOM per far leggere correttamente gli accenti a Excel.
  return '﻿' + [intestazione, ...righe].map(r => r.map(cella).join(';')).join('\r\n');
}

function scarica(nomeFile, contenuto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenuto], { type: tipo }));
  a.download = nomeFile;
  a.click();
  URL.revokeObjectURL(a.href);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
}

// --- Interfaccia ---
const $ = id => document.getElementById(id);
const oggi = () => new Date().toLocaleDateString('sv');
let inModifica = null; // registrazione in corso di modifica

// In modifica mostra anche le corde rimosse usate da quella registrazione, per non perderne i cicli.
function mostraContatori(cicli = {}) {
  const elenco = db.ropes.filter(r => !r.deleted || cicli[r.id]);
  $('contatori').innerHTML = elenco.length ? elenco.map(r => `
    <div class="riga">
      <span><strong>${esc(r.id)}</strong><br><small>${esc(descrivi(r))}</small></span>
      <span class="contatore">
        <button type="button" data-meno="${esc(r.id)}" aria-label="Minus">−</button>
        <input type="number" inputmode="numeric" min="0" step="1" data-corda="${esc(r.id)}" value="${cicli[r.id] || 0}" aria-label="Cycles ${esc(r.id)}">
        <button type="button" data-piu="${esc(r.id)}" aria-label="Plus">+</button>
      </span>
    </div>`).join('') : '<p class="vuoto">No ropes. Add them in “Ropes”.</p>';
}

$('contatori').addEventListener('click', e => {
  const id = e.target.dataset.piu || e.target.dataset.meno;
  if (!id) return;
  const input = [...$('contatori').querySelectorAll('input')].find(i => i.dataset.corda === id);
  input.value = Math.max(0, (parseInt(input.value, 10) || 0) + (e.target.dataset.piu ? 1 : -1));
});

function azzeraModulo() {
  inModifica = null;
  $('inModifica').hidden = $('annulla').hidden = true;
  $('data').value = oggi();
  $('pic').value = leggi('rope-cycles-pic', '');
  mostraContatori();
}
$('annulla').addEventListener('click', azzeraModulo);

$('modulo').addEventListener('submit', e => {
  e.preventDefault();
  $('conferma').textContent = '';
  const cycles = {};
  for (const i of $('contatori').querySelectorAll('input')) {
    const n = Number(i.value);
    if (n !== 0) cycles[i.dataset.corda] = n;
  }
  const v = {
    id: inModifica || Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: $('data').value,
    pic: $('pic').value.trim(),
    cycles,
    deleted: false,
  };
  const errore = valida(v, db.ropes);
  $('errore').textContent = errore || '';
  if (errore) return;
  // In modifica non cambio il PIC memorizzato: serve a registrare chi ha fatto la modifica.
  if (!inModifica) try { scrivi('rope-cycles-pic', v.pic); } catch {}
  if (!registra('Entries', v)) {
    $('errore').textContent = 'Save failed: browser storage is not available.';
    return;
  }
  azzeraModulo();
  $('conferma').textContent = `Saved: ${dataIt(v.date)}, ${v.pic}.`;
});

function mostraTotali() {
  const tot = calcolaTotali(db.entries);
  const corde = visibili(db.ropes);
  $('totali').innerHTML = `<div class="card"><h2>Total cycles per rope</h2>` +
    (corde.length ? `<table><tr><th>Rope</th><th class="num">Cycles</th></tr>` +
      corde.map(r => `<tr><td><strong>${esc(r.id)}</strong> ${esc(descrivi(r))}</td><td class="num">${tot[r.id] || 0}</td></tr>`).join('') + '</table>'
      : '<p class="vuoto">No ropes.</p>') + '</div>';
}

function mostraRegistro() {
  const ordinate = visibili(db.entries).sort((a, b) => b.date.localeCompare(a.date));
  $('elenco').innerHTML = ordinate.length ? ordinate.map(v => {
    const dettagli = Object.entries(v.cycles).map(([id, n]) => `${id}: ${n}`).join(' · ');
    return `<div class="card voce"><div><strong>${dataIt(v.date)}</strong> – ${esc(v.pic)}<br><small>${esc(dettagli)}</small></div>
      <div class="azioni"><button class="elimina" data-modifica="${esc(v.id)}">Edit</button>
      <button class="elimina" data-elimina="${esc(v.id)}">Delete</button></div></div>`;
  }).join('') : '<p class="vuoto">No entries.</p>';
}

$('elenco').addEventListener('click', e => {
  const { modifica, elimina } = e.target.dataset;
  const v = db.entries.find(x => x.id === (modifica || elimina));
  if (!v) return;
  if (elimina) {
    if (!confirm('Delete this entry? It stays recorded in the Drive database.')) return;
    registra('Entries', { ...v, deleted: true });
    mostraRegistro();
    return;
  }
  vai('inserisci');
  inModifica = v.id;
  $('inModifica').textContent = `Editing entry of ${dataIt(v.date)}`;
  $('inModifica').hidden = $('annulla').hidden = false;
  $('data').value = v.date;
  $('pic').value = v.pic;
  mostraContatori(v.cycles);
  window.scrollTo(0, 0);
});

const CAMPI_CORDA = ['id', 'type', 'length', 'color', 'manufacturer', 'serial', 'wll', 'mfg', 'note'];
const NUMERICI = ['length', 'wll'];

function mostraCorde() {
  $('elencoCorde').innerHTML = visibili(db.ropes).map(r => `
    <div class="card voce"><button class="corda" data-corda="${esc(r.id)}">
      <strong>${esc(r.id)}</strong> – ${esc(descrivi(r))}<br>
      <small>${esc([r.manufacturer, r.serial && 'S/N ' + r.serial, r.wll && 'WLL ' + r.wll + ' kg', r.mfg && 'Mfd. ' + r.mfg, r.note].filter(Boolean).join(' · '))}</small>
    </button><button class="elimina" data-rimuovi="${esc(r.id)}">Remove</button></div>`).join('') || '<p class="vuoto">No ropes.</p>';
}

$('elencoCorde').addEventListener('click', e => {
  const rimuovi = e.target.dataset.rimuovi;
  if (rimuovi) {
    if (!confirm(`Remove rope ${rimuovi} from the app? It stays recorded in the Drive database with all its cycles.`)) return;
    registra('Ropes', { ...corda(rimuovi), deleted: true });
    mostraCorde();
    return;
  }
  // Tocco su una corda: la carica nel modulo per modificarla.
  const r = corda(e.target.closest('[data-corda]')?.dataset.corda);
  if (!r) return;
  for (const k of CAMPI_CORDA) $('r_' + k).value = r[k] ?? '';
  window.scrollTo(0, 0);
});

$('moduloCorda').addEventListener('submit', e => {
  e.preventDefault();
  const r = Object.fromEntries(CAMPI_CORDA.map(k => {
    const val = $('r_' + k).value.trim();
    return [k, NUMERICI.includes(k) ? (val === '' ? null : Number(val)) : val];
  }));
  r.deleted = false;
  const errore = validaCorda(r);
  $('erroreCorda').textContent = errore || '';
  if (errore) return;
  const esistente = corda(r.id);
  if (esistente && !confirm(esistente.deleted
    ? `Rope ${r.id} was removed earlier. Restore it with its old cycles?`
    : `Rope ${r.id} already exists. Overwrite it?`)) return;
  if (!registra('Ropes', r)) {
    $('erroreCorda').textContent = 'Save failed: browser storage is not available.';
    return;
  }
  $('moduloCorda').reset();
  mostraCorde();
});

$('esportaCsv').addEventListener('click', () =>
  scarica(`rope-cycles-${oggi()}.csv`, creaCsv(db), 'text/csv;charset=utf-8'));

$('moduloSync').addEventListener('submit', e => {
  e.preventDefault();
  sync = { url: $('s_url').value.trim(), token: $('s_token').value.trim() };
  try { scrivi(CHIAVE_SYNC, sync); } catch {}
  sincronizza();
});

function vai(vista) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('attivo', b.dataset.vista === vista));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== vista);
  if (vista === 'totali') mostraTotali();
  if (vista === 'registro') mostraRegistro();
  if (vista === 'corde') mostraCorde();
}

// Dopo una sincronizzazione ridisegna la vista aperta, senza toccare un inserimento in corso.
function aggiornaVista() {
  mostraStato();
  const vista = document.querySelector('nav .attivo').dataset.vista;
  if (vista === 'inserisci') {
    const inCorso = [...$('contatori').querySelectorAll('input')].some(i => Number(i.value) !== 0);
    if (!inModifica && !inCorso) mostraContatori();
  } else vai(vista);
}

document.querySelector('nav').addEventListener('click', e => {
  const vista = e.target.dataset.vista;
  if (!vista) return;
  vai(vista);
  if (vista === 'inserisci' && !inModifica) mostraContatori();
});

$('r_type').innerHTML = TIPI.map(t => `<option>${t}</option>`).join('');
$('r_color').innerHTML = '<option value="">— not set —</option>' + COLORI.map(c => `<option>${c}</option>`).join('');
$('s_url').value = sync.url;
$('s_token').value = sync.token;
azzeraModulo();
sincronizza();
window.addEventListener('online', sincronizza);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
